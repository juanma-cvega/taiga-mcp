# Dependency updates open as pull requests, which is the only way onto main:
# the `main` ruleset requires a PR and a Code Owner review, and CODEOWNERS gives
# every file to @juanma-cvega, so review routing needs no config here. There is
# no auto-merge workflow in this repo -- every bump is merged by hand.
version: 2
updates:
  # Python dependencies. The `uv` ecosystem reads pyproject.toml -- both
  # [project] dependencies and the PEP 735 [dependency-groups] dev group -- and
  # updates uv.lock in the same pull request, so the lockfile never drifts from
  # the manifest.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      # The split here decides what ships. python-semantic-release parses every
      # commit that lands on main: fix: cuts a patch release, chore: releases
      # nothing. Runtime dependencies are part of what this server *is* -- an
      # httpx or mcp bump changes the installed behaviour -- so they release.
      # The dev toolchain does not ship, so mypy and ruff bumps must not tag a
      # version. `prefix-development` is what tells the two apart; it is
      # supported by the uv ecosystem, and Dependabot already classifies the
      # PEP 735 dev group as development (its PRs carry the deps-dev scope).
      #
      # The scope comes from `include`, not from the prefix: Dependabot appends
      # its own -- (deps) for runtime, (deps-dev) for the dev group -- so a
      # prefix of "chore(deps)" here produced titles reading chore(deps)(deps).
      prefix: "fix" # -> fix(deps):      patch release
      prefix-development: "chore" # -> chore(deps-dev): no release
      include: "scope"
    groups:
      # Grouped so a quiet week is one PR, not six. Only minor and patch are
      # grouped -- majors deliberately fall out into their own pull requests,
      # where a breaking change gets read on its own rather than buried in a
      # batch.
      runtime:
        patterns:
          - "httpx"
          - "mcp"
          - "pydantic"
          - "python-dotenv"
        update-types:
          - "minor"
          - "patch"
      dev-tools:
        patterns:
          - "mypy"
          - "pre-commit"
          - "pytest*"
          - "respx"
          - "ruff"
        update-types:
          - "minor"
          - "patch"
      # Catch-all for anything added later that nobody remembered to slot into
      # the groups above; without it a new dependency silently gets its own PR
      # every week. Slot new dependencies into the right group anyway: this one
      # can mix a runtime and a dev dependency into one pull request, which
      # then takes a single prefix, and a runtime bump landing under chore:
      # ships without a release. Grouping by dependency-type instead of by
      # pattern would rule that out, but `dependency-type` is not among the
      # group options the uv ecosystem supports.
      other-python:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the workflows. This also keeps the SHA-pinned
  # create-github-app-token in release.yml current -- Dependabot rewrites the
  # pin and its version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      # No `include: scope` here, so this prefix keeps its own scope: bumps
      # read chore(ci): rather than chore(ci)(deps):.
      prefix: "chore(ci)"
    groups:
      # Same rule as the Python groups: minor and patch batch together, majors
      # come alone. An action's major bump can change its inputs or its runner
      # -- actions/checkout 4 -> 7 is not a bump to skim inside a batch.
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
