# Releases on every push to main that carries a releasable commit:
#   feat: -> minor    fix:/perf: -> patch    BREAKING CHANGE: footer -> major
# A push with only chore:/docs:/ci:/test:/style:/refactor: commits runs the
# checks and stops -- no bump, no tag, no release.
#
# python-semantic-release owns the version end to end: it reads the commit
# history since the last tag, stamps pyproject.toml and uv.lock, writes the
# changelog, commits, tags v{version} and publishes the GitHub Release (notes
# only -- see the note on immutable releases below for why nothing is attached).
# Never bump the version by hand -- the commit history is the source of truth.
# Settings live in [tool.semantic_release] in pyproject.toml.
#
# main is protected by a ruleset (PRs required, verified signatures, linear
# history), so the release commit is pushed as a dedicated GitHub App that sits
# on that ruleset's bypass list. Its credentials are confined to the `release`
# environment; see the note on the job below.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    # Serialise releases: two pushes in flight would otherwise race to compute
    # and tag the same version. Never cancel a half-finished release.
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false

    # The App credentials live ONLY in this environment, whose deployment
    # branch policy allows main exclusively. A workflow added or altered in a
    # pull request runs from the PR ref and is denied the environment, so it
    # cannot borrow the App token to push to main. The secret, not the workflow
    # logic, is the security boundary. This also means a workflow_dispatch from
    # any other branch fails at the token step rather than releasing.
    environment: release

    # Least privilege: the workflow token only reads. Every write below goes
    # through the App token, which is what the ruleset bypass is granted to.
    permissions:
      contents: read

    steps:
      - name: Setup | Mint a token for the release App
        # The `main` ruleset requires pull requests and verified signatures, so
        # the release commit -- pushed straight to main, unsigned -- is rejected
        # for any actor not on the bypass list. GITHUB_TOKEN cannot be on it:
        # bypasses are granted to repository roles and Apps, and it is neither.
        # A dedicated App is, so we push as the App. Scoped to contents:write
        # only -- deliberately no `workflows` write, so a release can never
        # rewrite the pipeline that mints its own credentials.
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Setup | Check out the release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # The action does not unshallow, and semantic-release needs the full
          # history plus tags to find the last release and pick the bump.
          fetch-depth: 0
          # Not just for the fetch: checkout persists an http.extraheader
          # Authorization for whichever token it used, and that header wins over
          # the credentials PSR embeds in its push URL. Left as GITHUB_TOKEN,
          # the push would be attributed to GITHUB_TOKEN, miss the bypass and be
          # rejected -- even though PSR was handed the App token.
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup | Pin the release branch to this workflow's commit
        # Guards against releasing a newer commit that landed on main while
        # this run was queued.
        run: git reset --hard ${{ github.sha }}

      - name: Setup | Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup | Install dependencies
        run: uv sync

      - name: Check | Lint, format, types, tests
        # Gate the release on the same hooks that run pre-commit locally: a
        # failure here stops the release before anything is tagged.
        run: uv run pre-commit run --all-files

      - name: Release | Bump the version, commit, tag and release
        # No asset upload step follows: GitHub creates releases as immutable,
        # so assets have to be sealed in at creation, which PSR's separate
        # upload step cannot do -- it would fail the run after tagging. The
        # tag and the generated release notes are the release. uv.lock is
        # re-locked and staged by build_command so the release commit carries
        # it; see the note in [tool.semantic_release].
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          git_committer_name: ${{ steps.app-token.outputs.app-slug }}[bot]
          git_committer_email: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
