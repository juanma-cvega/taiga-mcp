# Runs the live smoke test against a real Taiga account.
#
# This does not trigger itself on a push. It is called by release.yml as the
# gate in front of the release job, so a version is never tagged and published
# from code that cannot talk to the real API. That ordering is the point: the
# mocked suite can only prove we send what a fake Taiga would have accepted,
# and a release that fails on first contact with the real thing is worse than
# a release that never happens.
#
# The tradeoff, accepted deliberately: a Taiga outage or an expired smoke
# credential now blocks releases even though the code may be fine. Re-run the
# release from the Actions tab once the API is back, or run this on its own
# via workflow_dispatch to check whether it is.
#
# It is kept out of pull-request.yml because a same-repo PR branch *does*
# receive repository secrets, so a smoke step there would let anyone with write
# access add a step that prints the Taiga credentials. (Fork PRs are not the
# exposure -- GitHub withholds secrets from those already.)
#
# The `environment:` below is the load-bearing half of that. The `smoke`
# environment's deployment branch policy allows main exclusively, so these
# secrets are unreadable from any other ref even if a future workflow asks for
# them by name. The secret, not the workflow logic, is the security boundary --
# the same reasoning as the `release` environment.
#
# What it buys over the mocked suite: only this proves the endpoints exist and
# behave -- the per-project status/type/priority/severity catalogues, the
# undocumented promote_to_user_story and /tasks/by_ref routes, and what Taiga
# takes down with each delete (tasks cascade from their story; an epic's
# stories survive it).
name: Smoke

on:
  # Called by release.yml. Environment secrets resolve from the job's own
  # `environment:` below, so the caller does not have to pass them in.
  workflow_call:
  # Re-runnable by hand after a Taiga-side change, without waiting for a merge.
  # Only from main -- the environment denies the secrets on any other ref.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Live Taiga lifecycle
    runs-on: ubuntu-latest
    environment: smoke

    # Serialise runs and never cancel one in flight. Two runs against the same
    # project would interleave and trip over each other's assertions, and --
    # unlike pull-request.yml, where cancelling costs nothing -- a half-finished
    # run leaves the epics, stories and tasks it created behind in the project.
    #
    # Job-level rather than workflow-level: this workflow is called by
    # release.yml, and a called workflow's top-level concurrency is evaluated in
    # the caller's context. At job level it means one thing wherever it runs.
    concurrency:
      group: smoke
      cancel-in-progress: false

    steps:
      - name: Setup | Check out the commit under test
        # No `ref`: when called from release.yml this is the caller's commit,
        # so the smoke test exercises exactly what is about to be released.
        uses: actions/checkout@v4

      - name: Setup | Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup | Install dependencies
        # Not `--locked`, for the same reason as pull-request.yml: uv.lock's
        # recorded version trails pyproject.toml between releases by design.
        run: uv sync

      - name: Check | Full lifecycle against the smoke project
        env:
          TAIGA_SMOKE_URL: ${{ secrets.TAIGA_SMOKE_URL }}
          TAIGA_SMOKE_USERNAME: ${{ secrets.TAIGA_SMOKE_USERNAME }}
          TAIGA_SMOKE_PASSWORD: ${{ secrets.TAIGA_SMOKE_PASSWORD }}
          # Set: without it the run is read-only and proves none of the write,
          # promote or delete behaviour. Points at a throwaway project.
          TAIGA_SMOKE_PROJECT_SLUG: ${{ secrets.TAIGA_SMOKE_PROJECT_SLUG }}
        run: uv run python scripts/smoke_test.py

      - name: Cleanup | Remove anything the run left behind
        # `always()`, because this matters precisely when the step above did
        # not finish: the smoke test tears itself down inline, so a failed,
        # timed-out or cancelled run abandons whatever it had created. Nobody
        # is watching a CI run to clean up after it, and the debris would
        # accumulate until it fouled a later run's assertions.
        #
        # Runs after a success too, where it is a no-op that also serves as a
        # check the teardown really was complete.
        if: always()
        env:
          TAIGA_SMOKE_URL: ${{ secrets.TAIGA_SMOKE_URL }}
          TAIGA_SMOKE_USERNAME: ${{ secrets.TAIGA_SMOKE_USERNAME }}
          TAIGA_SMOKE_PASSWORD: ${{ secrets.TAIGA_SMOKE_PASSWORD }}
          TAIGA_SMOKE_PROJECT_SLUG: ${{ secrets.TAIGA_SMOKE_PROJECT_SLUG }}
        run: uv run python scripts/smoke_cleanup.py
