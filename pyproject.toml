[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taiga-mcp"
version = "1.4.0"
description = "MCP server exposing Taiga project management — projects, epics, stories, tasks, and sprints — as tools for MCP clients like Claude Code"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.28.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[project.scripts]
taiga-mcp = "taiga_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taiga_mcp"]

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.semantic_release]
# The version is derived from the Conventional Commits in the history and is
# owned end to end by CI (.github/workflows/release.yml) -- do not edit the
# version above by hand. feat: -> minor, fix:/perf: -> patch, a BREAKING
# CHANGE: footer -> major; anything else releases nothing.
commit_parser = "conventional"
version_toml = ["pyproject.toml:project.version"]
# Conventional, so the release commit itself parses as a no-op release. The
# [skip ci] guard is load-bearing, not belt-and-braces: the release is pushed
# with a GitHub App token (to satisfy the main ruleset), and unlike
# GITHUB_TOKEN an App token *does* retrigger workflows. Without it, every
# release would start another release run.
commit_message = "chore: release {version} [skip ci]"

# uv.lock records the project's own version too, so it has to be re-locked
# after the bump and carried in the release commit -- otherwise the lockfile
# trails pyproject.toml and the next `uv sync` rewrites it under someone's
# feet, in whichever unrelated PR happens to touch it next.
#
# `assets` is the obvious way to add a file to the release commit, but it is
# dual-purpose: PSR also uploads every asset to the GitHub Release right after
# creating it, and GitHub now creates releases as immutable, with their assets
# sealed at creation. That upload is rejected, and it happens *after* the
# commit, tag and release, so the run goes red with the release already live.
#
# So we re-lock in build_command instead and stage the result ourselves. PSR
# runs build_command before it stages and commits, and its commit is a plain
# `git commit` over the index, so anything staged here rides along in the
# release commit. A failure aborts the release before anything is committed.
#
# The `pip install uv` is not redundant with the workflow's setup-uv step: the
# PSR GitHub Action is a Docker action, so build_command runs inside a
# python:3-slim container that cannot see anything installed on the runner
# host. Without this the build dies with "uv: not found" (exit 127). The
# container has git and a system-wide `safe.directory = *`, so `git add` works.
# Nothing is built: no sdist/wheel is attached, the tag and notes are the
# release.
build_command = "pip install uv && uv lock && git add uv.lock"
